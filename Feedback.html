    <main>
         
        <div> <table border="2px" cellpadding="10px" align="center">
                <form action="user.html" method="post"><center><h2>User Login</h2></center>
                    <tr>
                    <td><label>Name:</label></td>
                    <td><input type="text" name="Username"required></td>
                    </tr>
                    <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" name="Email"required></td>
                    </tr>
                    <tr>
                    <td>Branch</td>
                    <td><select>
                        <option>Balanagar</option>
                        <option>SR Nagar</option>
                        <option>KPHB</option>
                        <option>LB Nagar</option>
                    </select></td>
                    </tr>
                   <tr>
                    <td><label>Visit Date:</label></td>
                    <td><input type="date" name="date"required></td>
                    </td>
                  </tr>
                  <tr>
                    <td>Rating</td>
                    <td>
                        <input type="radio" name="rating">Excellent
                        <input type="radio" name="rating">Good
                        <input type="radio" name="rating">Average
                    </td>
                  </tr>
                  <tr>
                    <td>Services Used</td>
                   <td>
                    <input type="checkbox" name="Services">ATM
                    <input type="checkbox" name="Services">Loan
                    <input type="checkbox" name="Services">New Account
                   </td>
                  </tr>
                  <tr>
                    <td><label>Suggestions</label></td>
                    <td><input type="text" name="text"required></td>
                  </tr>
                  <tr>
                    <td colspan="2" align="center"><input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                  </tr>
                </form>
                </table>
        </div>

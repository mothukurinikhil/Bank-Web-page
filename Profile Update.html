    <main>
         
        <div> <table border="2px" cellpadding="10px" align="center">
                <form ><center><h2>Customer profile Update</h2></center>
                    <tr>
                    <td><label>Name:</label></td>
                    <td><input type="text" name="Username"required></td>
                    </tr>
                    <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" name="Email"required></td>
                    </tr>
                    <tr>
                    <td><label>Mobile</label></td>
                    <td><input type="tel" name="num"required></td>
                    </tr>
                    <tr>
                    <td><label>Website</label></td>
                    <td><input type="url" name="url"required></td>
                    </tr>
                    <tr>
                    <td><label>Profile Picture</label></td>
                    <td><input type="file" name="file"required></td>
                    </tr>
                  <tr>
                    <td>Branch</td>
                    <td><select>
                        <option>Balanagar</option>
                        <option>SR Nagar</option>
                        <option>KPHB</option>
                        <option>LB Nagar</option>
                    </select></td>
                    </tr>
                   <tr>
                    <td><label>DOB</label></td>
                    <td><input type="date" name="date"required></td>
                    </td>
                  </tr>
                  <tr>
                    <td><label>Address</label></td>
                    <td><textarea rows="3" cols="33"></textarea></td>
                  </tr>
                  <tr>
                    <td colspan="2" align="center"><input type="submit" value="Submit">
                        
                    </td>
                </form>
                </table>
        </div>
